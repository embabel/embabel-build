name: Notify on Recovery

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch to check recovery on'
        required: false
        type: string
        default: 'main'
      caller_run_id:
        description: 'github.run_id from the calling workflow — used to resolve the correct workflow history'
        required: true
        type: string
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  check-recovery:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      is-recovery: ${{ steps.check.outputs.is-recovery }}
    steps:
      - name: Check if previous build failed
        id: check
        uses: actions/github-script@v9
        env:
          CALLER_RUN_ID: ${{ inputs.caller_run_id }}
          BRANCH: ${{ inputs.branch }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const callerRunId = Number(process.env.CALLER_RUN_ID);
            const run = { ...context.repo, run_id: callerRunId };

            // A rerun keeps its run ID; check its earlier attempts first.
            for (let attempt = context.runAttempt - 1; attempt >= 1; attempt--) {
              const { data } = await github.rest.actions.getWorkflowRunAttempt({
                ...run,
                attempt_number: attempt
              });
              if (data.conclusion === 'failure' || data.conclusion === 'success') {
                core.setOutput('is-recovery', String(data.conclusion === 'failure'));
                return;
              }
            }

            const { data: currentRun } = await github.rest.actions.getWorkflowRun(run);
            for await (const { data: runs } of github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: currentRun.workflow_id,
              branch: process.env.BRANCH,
              exclude_pull_requests: true,
              per_page: 100
            })) {
              const previousRun = runs.find(candidate =>
                candidate.run_number < currentRun.run_number && candidate.status === 'completed');
              if (previousRun) {
                core.setOutput('is-recovery', String(previousRun.conclusion === 'failure'));
                return;
              }
            }
            core.setOutput('is-recovery', 'false');

  notify-recovery:
    needs: [check-recovery]
    if: needs.check-recovery.outputs.is-recovery == 'true'
    uses: embabel/embabel-build/.github/workflows/discord-notify.yml@main
    with:
      message: '✅ Build Fixed'
    secrets: inherit
