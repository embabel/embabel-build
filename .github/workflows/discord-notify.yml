name: Discord Notification

on:
  workflow_call:
    inputs:
      message:
        description: 'Message prefix to send to Discord'
        type: string
        required: false
        default: '❌ Build failed'
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          MESSAGE: ${{ inputs.message }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook is not configured; skipping notification."
            exit 0
          fi
          content=$(printf '%s: %s (%s)\nCommit: %.7s · Attempt: %s\n%s/%s/actions/runs/%s/attempts/%s' \
            "$MESSAGE" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")
          jq -n --arg content "$content" '{content: $content}' > "$RUNNER_TEMP/discord-payload.json"
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/discord-payload.json" \
            "$DISCORD_WEBHOOK_URL"
